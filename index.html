<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02152f" />
    <meta name="description" content="Tidal Atelier — a living ocean meditation simulated and rendered entirely with WebGPU." />
    <title>Tidal Atelier — Living WebGPU Ocean</title>

    <!-- Open Graph / social sharing cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tidal Atelier" />
    <meta property="og:title" content="Tidal Atelier — Living WebGPU Ocean" />
    <meta property="og:description" content="A living Hokusai-style ocean, procedurally simulated and rendered in real time with WebGPU. Move the pointer to disturb the water." />
    <meta property="og:image" content="https://kuil09.github.io/zen-garden/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://kuil09.github.io/zen-garden/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tidal Atelier — Living WebGPU Ocean" />
    <meta name="twitter:description" content="A living Hokusai-style ocean, procedurally simulated and rendered in real time with WebGPU." />
    <meta name="twitter:image" content="https://kuil09.github.io/zen-garden/og-image.png" />

    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Headless virtual time does not advance CSS transitions, so screenshots
      // would otherwise catch the canvas part-way through its fade-in.
      if (new URLSearchParams(location.search).has('nofade')) {
        document.documentElement.classList.add('no-fade');
      }
    </script>
</head>
  <body>
    <main id="experience" aria-label="Tidal Atelier, a living procedural ocean meditation">
      <canvas
        id="ocean"
        tabindex="0"
        aria-label="Blue waves continually form, cross, collide, and dissolve into foam. Move the pointer to disturb the water. Press Space to pause."
      ></canvas>

      <button id="soundToggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Toggle ocean sound">
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="currentColor"/></svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" fill="currentColor"/></svg>
      </button>
      <button id="motionToggle" class="visually-hidden" type="button" aria-pressed="false">
        Pause ocean motion
      </button>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section id="notice" class="notice" hidden>
        <h1>WebGPU is required for the living ocean.</h1>
        <p>Open this page in a current Chrome, Edge, or Safari browser to enter the procedural ocean.</p>
      </section>

      <noscript>
        <p class="notice noscript">JavaScript is required for the living ocean.</p>
      </noscript>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
