<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02152f" />
    <meta name="description" content="Tidal Atelier — a living ocean meditation simulated and rendered entirely with WebGPU." />
    <title>Tidal Atelier — Living WebGPU Ocean</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="experience" aria-label="Tidal Atelier, a living procedural ocean meditation">
      <canvas
        id="ocean"
        tabindex="0"
        aria-label="Blue waves continually form, cross, collide, and dissolve into foam. Move the pointer to disturb the water. Press Space to pause."
      ></canvas>

      <button id="motionToggle" class="visually-hidden" type="button" aria-pressed="false">
        Pause ocean motion
      </button>
      <p id="status" class="visually-hidden" role="status" aria-live="polite"></p>

      <section id="notice" class="notice" hidden>
        <h1>WebGPU is required for the living ocean.</h1>
        <p>Open this page in a current Chrome, Edge, or Safari browser to enter the procedural ocean.</p>
      </section>

      <noscript>
        <p class="notice noscript">JavaScript is required for the living ocean.</p>
      </noscript>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
