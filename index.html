<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111521" />
    <meta name="description" content="WebGPU로 만든 느린 파동의 휴식 공간" />
    <title>잔물결 — 잠시 멍때리는 정원</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Dodum&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <canvas id="garden" aria-label="천천히 움직이는 추상적인 물결 그래픽"></canvas>

      <header class="masthead">
        <a class="wordmark" href="/" aria-label="잔물결 처음으로">잔물결<span>.</span></a>
        <p class="status"><i></i> 지금, 천천히 흐르는 중</p>
      </header>

      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">A SMALL PLACE TO PAUSE</p>
        <h1 id="title">아무것도 하지 않아도<br />괜찮은 시간.</h1>
        <p class="lead">빛과 물결이 만드는 같은 듯 다른 장면을<br />그저 바라보세요. 잠깐이면 충분합니다.</p>
      </section>

      <aside class="controls" aria-label="장면 제어">
        <button class="sound-toggle" id="motionToggle" type="button" aria-pressed="false">
          <span class="pause-icon" aria-hidden="true"></span>
          <span class="button-text">잠시 멈추기</span>
        </button>
        <div class="mood" aria-label="장면 농도">
          <span>잔잔함</span>
          <input id="intensity" type="range" min="0" max="100" value="52" aria-label="파동의 농도" />
          <span>깊어짐</span>
        </div>
        <button class="quiet-toggle" id="quietToggle" type="button" aria-pressed="false">글자 숨기기</button>
      </aside>

      <footer>
        <p>마우스나 손끝으로 물결에 작은 흔적을 남겨보세요. <kbd>H</kbd>로 조용히 머물 수 있어요.</p>
        <p>WEBGPU · <span id="clock">--:--</span></p>
      </footer>

      <div class="notice" id="notice" hidden>
        <p>이 브라우저는 WebGPU를 아직 지원하지 않아요.</p>
        <p>최신 Chrome, Edge 또는 Safari에서 다시 열어주세요.</p>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
